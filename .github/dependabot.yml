# Keeps the SHA-pinned GitHub Actions (actions/checkout, actions/setup-node)
# up to date: Dependabot opens a PR that bumps the pinned commit SHA — and its
# `# vX.Y.Z` comment — whenever a new release lands, so pinning to an immutable
# SHA never means silently running an outdated action.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
