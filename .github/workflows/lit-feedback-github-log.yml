name: lit — feedback → private GitHub log
on:
  schedule:
    - cron: 8,23,38,53 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — report what would be logged, write nothing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lit-feedback-github-log
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.FEEDBACK_LOG_REPO != '' }}
    steps:
      - name: Checkout site repo (has the mirror script)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0
      - name: Checkout the private feedback-log repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.FEEDBACK_LOG_REPO }}
          token: ${{ secrets.FEEDBACK_LOG_TOKEN }}
          path: _feedback-log
      - name: Mirror new feedback into the log repo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FEEDBACK_LOG_DIR: _feedback-log
        run: node lit/_scraper/feedback-github-log.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Commit + push new submissions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: _feedback-log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new feedback to log."
          else
            git commit -m "feedback: mirror new submission(s)"
            git push
          fi
