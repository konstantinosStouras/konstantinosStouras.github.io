# TEMPORARY — evidence probe for the Nature/Science filtered-journal work.
# Lives ONLY on the claude/nature-science-filtering-s59mno feature branch and
# is deleted before merge. See _probe/probe.mjs for what it gathers and why
# (the dev sandbox's egress blocks the scholarly APIs; Actions runners don't).

name: probe — nature/science filtering evidence

on:
  push:
    branches: [claude/nature-science-filtering-s59mno]
    paths: ['_probe/**']
  workflow_dispatch: {}

concurrency:
  group: probe-ns
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run probe
        run: node _probe/probe.mjs

      - name: Commit results back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _probe/results.json
          git commit -m "probe: nature/science filtering evidence" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
