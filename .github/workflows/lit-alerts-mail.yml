name: lit — e-mail alerts mailer
on:
  schedule:
    - cron: 17 * * * *
  workflow_run:
    workflows:
      - lit — check for newly-published papers (incremental)
      - lit — check for new FT50 catalog papers (incremental)
      - lit — update multi-journal data
      - lit — update FT50 (merged catalog) data
      - lit — update working-papers archive
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — read alerts and print, but send nothing
        type: boolean
        default: false
      rewind:
        description: "Recovery: clear high-water marks on recently-created alerts (does not send). Run a normal dispatch afterwards to deliver."
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lit-alerts-mail
  cancel-in-progress: false
jobs:
  mail:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'master' }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: none
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Offline checks
        run: |
          node lit/_scraper/alerts-mailer.mjs --selftest
          node lit/_scraper/alerts-reliability-selftest.mjs
          node lit/_scraper/news-selftest.mjs
      - name: Install mailer dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0 nodemailer@6.10.1
      - name: Send e-mail alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
        run: node lit/_scraper/alerts-mailer.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.rewind) && '--rewind' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
