name: lit — update multi-journal data
on:
  schedule:
    - cron: 30 5 * * *
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/lit-update-data.yml
      - lit/_scraper/build-data.mjs
      - lit/_scraper/ec-pages.mjs
      - lit/_scraper/pnas-crawl.mjs
      - lit/_scraper/informs-editors.mjs
      - lit/data/_pnas-concepts.json
      - lit/data/_informs-editors.json
concurrency:
  group: lit-cloud-core-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: core
          ssh-key: ${{ secrets.LIT_DATA_CORE_DEPLOY_KEY }}
          datasets: core ft50
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Build data (Crossref + sigecom + OpenAlex/DBLP/S2)
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          LIT_MAILTO: kstouras@gmail.com
        run: node lit/_scraper/build-data.mjs
      - name: Publish core data to its repository
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish core
      - name: Verify published data
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs verify core
      - name: Summary
        if: always()
        run: |
          echo "### lit data build" >> "$GITHUB_STEP_SUMMARY"
          if [ -f lit/data/meta.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat lit/data/meta.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-core-${{ github.run_id }}
          path: _lit-data/core/data/
          retention-days: 14
          if-no-files-found: ignore
