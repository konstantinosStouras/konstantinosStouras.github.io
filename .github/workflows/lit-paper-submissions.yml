name: lit — ingest suggested working papers
on:
  schedule:
    - cron: 4,14,24,34,44,54 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — resolve + decide + print, but ingest nothing and mark nothing
        type: boolean
        default: false
      scan:
        description: List pending submissions and exit (ingests nothing)
        type: boolean
        default: false
concurrency:
  group: lit-cloud-workingpapers-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: workingpapers
          ssh-key: ${{ secrets.LIT_DATA_WORKINGPAPERS_DEPLOY_KEY }}
          datasets: core ft50 workingpapers
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0 nodemailer@6.10.1
      - name: Ingest suggested working papers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
          FEEDBACK_TO: ${{ secrets.FEEDBACK_TO }}
          SUB_MAILTO: kstouras+litsub@gmail.com
        run: node lit/_scraper-workingpapers/ingest-submissions.mjs ${{ github.ref != 'refs/heads/master' && '--dry-run' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.scan) && '--scan' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Publish workingpapers data to its repository
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish workingpapers
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-workingpapers-${{ github.run_id }}
          path: _lit-data/workingpapers/data/
          retention-days: 14
          if-no-files-found: ignore
