name: lit — update analytics summary
on:
  schedule:
    - cron: 17 * * * *
  workflow_run:
    branches:
      - master
    types:
      - completed
    workflows:
      - lit — update multi-journal data
      - lit — check for newly-published papers (incremental)
      - lit — update FT50 (merged catalog) data
      - lit — check for new FT50 catalog papers (incremental)
      - lit — refresh citation counts
      - lit-ft50 — refresh citation counts
      - lit — backfill pre-print links
      - lit-ft50 — backfill pre-print links
      - lit — backfill FT50 abstracts (OpenAlex/S2)
      - lit — backfill ISR/MkSc editors + INFORMS abstracts (pubsonline attempt)
      - lit — backfill citation graph
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/lit-analytics.yml
      - lit/_scraper/build-analytics.mjs
      - lit/_scraper/build-disruption.mjs
      - lit/_scraper/build-citeflow.mjs
      - lit/_scraper/_analytics-inputs.mjs
      - lit/_scraper/analytics-selftest.mjs
      - lit/_scraper/verify-analytics-live.mjs
      - lit/analytics/index.html
      - lit/data/**
      - lit/data-ft50/**
      - lit/data-refs/**
concurrency:
  group: lit-cloud-analytics-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: analytics
          ssh-key: ${{ secrets.LIT_DATA_ANALYTICS_DEPLOY_KEY }}
          datasets: core ft50 refs analytics
      - name: Checkout data shard — lit-data-abs4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs4
          path: _analytics-shards/lit-data-abs4
      - name: Checkout data shard — lit-data-abs3-omecon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs3-omecon
          path: _analytics-shards/lit-data-abs3-omecon
      - name: Checkout data shard — lit-data-abs3-rest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs3-rest
          path: _analytics-shards/lit-data-abs3-rest
      - name: Checkout data shard — lit-data-nature
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-nature
          path: _analytics-shards/lit-data-nature
      - name: Checkout data shard — lit-data-science
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-science
          path: _analytics-shards/lit-data-science
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Test analytics filters and calculations
        run: node lit/_scraper/analytics-selftest.mjs
      - name: Build analytics summary
        run: node lit/_scraper/build-analytics.mjs
      - name: Audit the published counters
        continue-on-error: true
        run: node lit/_scraper/counters-selftest.mjs
      - name: Build disruption analysis
        run: node lit/_scraper/build-disruption.mjs
      - name: Build citation flows
        run: node lit/_scraper/build-citeflow.mjs
      - name: Validate the complete analytics snapshot
        run: node lit/_scraper/analytics-selftest.mjs --data
      - name: Publish analytics data to its repository
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish analytics
      - name: Verify published data
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs verify analytics
      - name: Summary
        if: always()
        run: |
          echo "### lit analytics summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f lit/analytics/data.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            node -e 'const d=require("./lit/analytics/data.json");console.log(JSON.stringify({generated:d.generated,years:[d.yearMin,d.yearMax],totals:d.totals},null,2))' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f lit/analytics/disruption.json ]; then
            echo '**Disruption analysis**' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            node -e 'const d=require("./lit/analytics/disruption.json");console.log(JSON.stringify(d.totals,null,2))' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-analytics-${{ github.run_id }}
          path: _lit-data/analytics/data/
          retention-days: 14
          if-no-files-found: ignore
