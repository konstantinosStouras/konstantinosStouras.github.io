name: lit — update working-papers archive
on:
  schedule:
    - cron: 15 6 * * *
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/lit-workingpapers-update-data.yml
      - lit/_scraper-workingpapers/build-data.mjs
concurrency:
  group: lit-cloud-workingpapers-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: workingpapers
          ssh-key: ${{ secrets.LIT_DATA_WORKINGPAPERS_DEPLOY_KEY }}
          datasets: core ft50 workingpapers
      - name: Checkout data shard — lit-data-abs4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs4
          path: _analytics-shards/lit-data-abs4
      - name: Checkout data shard — lit-data-abs3-omecon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs3-omecon
          path: _analytics-shards/lit-data-abs3-omecon
      - name: Checkout data shard — lit-data-abs3-rest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-abs3-rest
          path: _analytics-shards/lit-data-abs3-rest
      - name: Checkout data shard — lit-data-nature
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-nature
          path: _analytics-shards/lit-data-nature
      - name: Checkout data shard — lit-data-science
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: konstantinosStouras/lit-data-science
          path: _analytics-shards/lit-data-science
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Refresh the working-papers archive (OpenAlex, gently paced)
        env:
          WP_MAILTO: kstouras+litwp@gmail.com
          WP_MAX_AUTHORS: "250"
          WP_BUDGET_MS: "2100000"
          WP_PACE_MS: "1500"
          WP_CATALOG_DIRS: lit/data,lit/data-ft50,_analytics-shards/lit-data-abs4/data,_analytics-shards/lit-data-abs3-omecon/data,_analytics-shards/lit-data-abs3-rest/data,_analytics-shards/lit-data-nature/data,_analytics-shards/lit-data-science/data
        run: node lit/_scraper-workingpapers/build-data.mjs
      - name: Publish workingpapers data to its repository
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish workingpapers
      - name: Verify published data
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs verify workingpapers
      - name: Summary
        if: always()
        run: |
          echo "### lit working-papers archive" >> "$GITHUB_STEP_SUMMARY"
          if [ -f lit/data-workingpapers/meta.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat lit/data-workingpapers/meta.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-workingpapers-${{ github.run_id }}
          path: _lit-data/workingpapers/data/
          retention-days: 14
          if-no-files-found: ignore
