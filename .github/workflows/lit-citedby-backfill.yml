name: lit — backfill forward citations (cited-by)
on:
  schedule:
    - cron: 25 */6 * * *
  workflow_dispatch: {}
concurrency:
  group: lit-cloud-refs-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: refs
          ssh-key: ${{ secrets.LIT_DATA_REFS_DEPLOY_KEY }}
          datasets: core ft50 refs
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Harvest a slice of papers' forward citations (OpenAlex, gently paced)
        env:
          CB_MAILTO: kstouras+litcitedby@gmail.com
          CB_MAX_PAPERS: "2500"
          CB_BUDGET_MS: "2400000"
          CB_OA_PACE_MS: "300"
          CB_MAX_CITERS: "3000"
        run: node lit/_scraper-refs/build-citedby.mjs
      - name: Publish refs data to its repository
        if: always() && github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish refs
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-refs-${{ github.run_id }}
          path: _lit-data/refs/data/
          retention-days: 14
          if-no-files-found: ignore
