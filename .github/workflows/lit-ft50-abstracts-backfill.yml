name: lit — backfill FT50 abstracts (OpenAlex/S2)

# Fills missing/stub abstracts across the FT50 catalog (data-ft50/) from
# OpenAlex (abstract_inverted_index, batched 50/call), an optional Semantic
# Scholar leg (500 DOIs/POST; drops out on throttle) and — with the
# ELSEVIER_API_KEY + ELSEVIER_INST_TOKEN secrets — Elsevier's Scopus Search
# (batched) and Abstract Retrieval (per DOI) APIs for 10.1016/… DOIs — many
# FT50 journals (finance/econ especially) deposit no abstract to Crossref at
# all, and the Elsevier ones are the bulk of what is still missing.
# Runs bounded ~40-min slices four times a day, newest papers first, into
# data-ft50/_api-abstracts.json, and applies UPGRADE-only (betterAbstract) to
# the served papers files; the FT50 daily build re-applies the committed
# cache (applyAbstractCaches), so a rebuild never regresses one. The five
# INFORMS journals' teasers come from the pubsonline page harvest instead
# (lit/data/_informs-abstracts.json) — this job covers the other ~45.
# Distinct OpenAlex quota identity kstouras+litft50abs.

on:
  schedule:
    - cron: '5 */6 * * *'    # four slices a day, a free minute slot
  workflow_dispatch: {}      # run on demand from the Actions tab

# SAME concurrency group as lit-ft50-update-data.yml — every data-ft50 writer
# queues behind the others, never racing a commit.
concurrency:
  group: lit-ft50-update-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55      # 40-min crawl budget + apply/commit headroom
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Backfill FT50 abstracts (bounded slice, newest first)
        env:
          FT50_ABS_BUDGET_MS: '2400000'
          # Optional keys — every keyed leg stays inert until its secret is set
          # on the repo. ELSEVIER_API_KEY (a free key from dev.elsevier.com) +
          # ELSEVIER_INST_TOKEN (the institutional token Elsevier support issues
          # for server-side use) unlock the two Elsevier legs for 10.1016/… DOIs
          # — the bulk of the still-missing FT50 abstracts (EJOR, JFE, AOS,
          # OBHDP, JAE, Research Policy…): Scopus Search batched (25 DOIs/GET)
          # and per-DOI Abstract Retrieval. The token is sent ONLY as the
          # X-ELS-Insttoken header over https, never in a URL or a log line —
          # its terms of use (lit/_ELSEVIER-ABSTRACTS-SETUP.md). Without it
          # Elsevier answers with metadata and no abstract text off-campus.
          # S2_API_KEY moves the Semantic Scholar leg off the throttled
          # anonymous pool.
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}   # optional — the Meta API key (abstracts for Springer/Palgrave/Kluwer DOIs)
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: node lit/_scraper-ft50/abstracts-ci.mjs

      - name: Commit refreshed data
        if: always() && github.ref == 'refs/heads/master'
        # Push-retry replay pattern (see lit-preprints-backfill.yml): on a
        # rejected push, take the new tip and re-apply ONLY our cache finds.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lit/data-ft50
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          # The cache is CHUNKED, so the replay copy must carry EVERY part:
          # copying the first file alone would hand the replay a fraction of
          # this run's finds and silently drop the rest.
          rm -rf /tmp/lit-ft50-abs-ours && mkdir -p /tmp/lit-ft50-abs-ours
          cp lit/data-ft50/_api-abstracts*.json /tmp/lit-ft50-abs-ours/
          git commit -m "lit: FT50 abstracts backfill (OpenAlex/S2)"
          for i in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (concurrent commit?) — replaying our finds on the new tip…"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node lit/_scraper-ft50/abstracts-ci.mjs --apply-only --merge-cache=/tmp/lit-ft50-abs-ours/_api-abstracts.json
            git add lit/data-ft50
            if git diff --cached --quiet; then
              echo "The concurrent commit already contains these abstracts — nothing left to push."
              exit 0
            fi
            git commit -m "lit: FT50 abstracts backfill (OpenAlex/S2)"
            sleep 5
          done
          echo "::error::Could not push the abstracts data after 3 attempts."
          exit 1
