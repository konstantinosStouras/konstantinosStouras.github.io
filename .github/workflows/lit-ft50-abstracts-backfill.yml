name: lit — backfill FT50 abstracts (OpenAlex/S2)
on:
  schedule:
    - cron: 5 */6 * * *
  workflow_dispatch: {}
concurrency:
  group: lit-cloud-ft50-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: ft50
          ssh-key: ${{ secrets.LIT_DATA_FT50_DEPLOY_KEY }}
          datasets: core ft50
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Backfill FT50 abstracts (bounded slice, newest first)
        env:
          FT50_ABS_BUDGET_MS: "2400000"
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: node lit/_scraper-ft50/abstracts-ci.mjs
      - name: Publish ft50 data to its repository
        if: always() && github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish ft50
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-ft50-${{ github.run_id }}
          path: _lit-data/ft50/data/
          retention-days: 14
          if-no-files-found: ignore
