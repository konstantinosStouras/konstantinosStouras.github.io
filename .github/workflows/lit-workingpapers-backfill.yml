name: lit — backfill working-papers archive
on:
  schedule:
    - cron: 20 */3 * * *
  workflow_dispatch: {}
concurrency:
  group: lit-cloud-workingpapers-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: workingpapers
          ssh-key: ${{ secrets.LIT_DATA_WORKINGPAPERS_DEPLOY_KEY }}
          datasets: core ft50 workingpapers
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Crawl a slice of authors' working papers (OpenAlex, gently paced)
        env:
          WP_MAILTO: kstouras+litwp@gmail.com
          WP_MAX_AUTHORS: "600"
          WP_BUDGET_MS: "3000000"
          WP_PACE_MS: "1500"
        run: node lit/_scraper-workingpapers/build-data.mjs
      - name: Publish workingpapers data to its repository
        if: always() && github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish workingpapers
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-workingpapers-${{ github.run_id }}
          path: _lit-data/workingpapers/data/
          retention-days: 14
          if-no-files-found: ignore
