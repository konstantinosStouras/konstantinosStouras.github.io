name: site — offline checks
on:
  push:
    paths:
      - "**/*.html"
      - tools/**
      - lit/_firestore.rules
      - lit/_scraper/users-selftest.mjs
      - lit/_scraper/abstract-display-selftest.mjs
      - lit/lit-abstract.js
      - lit/lit-news.js
      - lit/lit-acct-nav.js
      - images/**
      - lit/og-image.jpg
      - lit/share-square.jpg
      - fun/og-image.jpg
      - fun/share-square.jpg
      - sustainable-supply-chains/og-image.jpg
      - sustainable-supply-chains/share-square.jpg
      - robots.txt
      - fun/capitals/**
      - tools/account-widget-guard.mjs
      - .github/workflows/site-checks.yml
      - "!daywear/**"
      - "!wearwell/**"
  pull_request:
    paths:
      - "**/*.html"
      - tools/**
      - lit/_firestore.rules
      - lit/_scraper/users-selftest.mjs
      - lit/_scraper/abstract-display-selftest.mjs
      - lit/lit-abstract.js
      - lit/lit-news.js
      - lit/lit-acct-nav.js
      - images/**
      - robots.txt
      - fun/capitals/**
      - .github/workflows/site-checks.yml
      - "!daywear/**"
      - "!wearwell/**"
  workflow_dispatch: null
  workflow_call:
    inputs:
      revision:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
          submodules: recursive
      - name: Load data used by display checks
        uses: ./.github/actions/lit-data
        with:
          datasets: core ft50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Load backend source only for deployment-safety checks
        run: node .github/scripts/load-check-sources.mjs
      - name: Every page previews properly when somebody shares it
        run: node tools/share-check.mjs --verbose
      - name: No folder deploys into another Firebase project
        run: node tools/deploy-guard-selftest.mjs
      - name: The users roster and the message rules agree with the pages
        run: node lit/_scraper/users-selftest.mjs
      - name: The What's-new review gate holds
        run: node lit/_scraper/news-selftest.mjs
      - name: No card shows the INFORMS acceptance sentence as abstract
        run: node lit/_scraper/abstract-display-selftest.mjs
      - name: The Capitals quiz accepts only real capitals
        run: node fun/capitals/tools/selftest.mjs
      - name: The shared account widget is the same in every page
        run: node tools/account-widget-guard.mjs --static
