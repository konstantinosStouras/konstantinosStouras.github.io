name: site — offline checks

# The offline guard rails for the SITE itself, as opposed to its data.
#
# Every other workflow in this repository writes data: the daily builds, the
# 15- and 20-minute incremental harvests, the pre-print / citations /
# references / cited-by / working-papers / editors backfills. None of them
# looks at the served HTML, so nothing in CI has ever read a page. That is how
# The Lit's share card came to spend months telling everyone who saw it that
# the catalogue covers "eight sources" and lives at stouras.com/fun/lit, and
# how twenty-five backup copies of the site came to be published — each
# declaring og:url = a live page, which is what makes a link preview attach
# itself to the wrong address.
#
# No network, no credentials, no writes: `permissions: contents: read` and
# nothing here pushes. It CANNOT interfere with the data workflows, which is
# deliberate — see the branch-protection section of CLAUDE.md.

on:
  push:
    paths:
      - '**/*.html'
      - 'tools/**'
      # the roster/messaging guard reads the rules and three pages against
      # each other, so a rules edit alone must run the checks
      - 'lit/_firestore.rules'
      - 'lit/_scraper/users-selftest.mjs'
      - 'lit/lit-news.js'
      - 'lit/lit-acct-nav.js'
      # share-check.mjs measures the real pixels of every og:image against the
      # numbers the pages declare, so a card regenerated at a new size has to
      # run the checks even when no HTML moved.
      - 'images/**'
      - 'lit/og-image.jpg'
      - 'lit/share-square.jpg'
      - 'fun/og-image.jpg'
      - 'fun/share-square.jpg'
      - 'sustainable-supply-chains/og-image.jpg'
      - 'sustainable-supply-chains/share-square.jpg'
      - 'robots.txt'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'tools/**'
      - 'lit/_firestore.rules'
      - 'lit/_scraper/users-selftest.mjs'
      - 'lit/lit-news.js'
      - 'lit/lit-acct-nav.js'
      - 'images/**'
      - 'robots.txt'
      - '.github/workflows/site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Its own group. It must never queue behind — or hold up — a data workflow.
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A BACKSTOP, not a budget. The two checks themselves take seconds; the
    # time goes on `actions/checkout`, because this repository carries ~1 GB of
    # committed data (lit/data, lit/data-ft50, lit/data-refs,
    # lit/data-workingpapers, lit/analytics and the vendored app bundles). A
    # shallow fetch of that measured 8m20s on a runner — which, under the 8
    # minutes this used to allow, cancelled the job inside the checkout and
    # reported the whole run as `cancelled` with nothing having been checked.
    timeout-minutes: 25
    steps:
      # Pinned by commit SHA, like every other workflow in this repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Every page previews properly when somebody shares it
        run: node tools/share-check.mjs --verbose

      - name: No folder deploys into another Firebase project
        run: node tools/deploy-guard-selftest.mjs

      # The roster and the message threads: the rules, the main page, the
      # Feedback page and the sub-page menu are four files that nothing else
      # holds together, and one of them carries the maintainer's address.
      - name: The users roster and the message rules agree with the pages
        run: node lit/_scraper/users-selftest.mjs

      # …and the What's-new gate, which pins the OTHER copy of that address.
      - name: The What's-new review gate holds
        run: node lit/_scraper/news-selftest.mjs
