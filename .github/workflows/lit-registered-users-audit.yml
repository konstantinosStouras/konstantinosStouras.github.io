name: lit — registered-users tally audit
on:
  schedule:
    - cron: 10 7 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — report what would be removed and seeded, write nothing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lit-registered-users-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Offline checks
        run: node lit/_scraper/registered-users-audit.mjs --selftest
      - name: Install dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0
      - name: Reconcile the registered-users tally and roster with Firebase Auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node lit/_scraper/registered-users-audit.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
