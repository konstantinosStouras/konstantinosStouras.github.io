name: lit — backfill citation graph
on:
  schedule:
    - cron: 40 */3 * * *
  workflow_dispatch: {}
concurrency:
  group: lit-cloud-refs-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: refs
          ssh-key: ${{ secrets.LIT_DATA_REFS_DEPLOY_KEY }}
          datasets: core ft50 refs
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Fetch a slice of papers' references (Crossref, gently paced)
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          REFS_MAILTO: kstouras+litrefs@gmail.com
          REFS_MAX_PAPERS: "6000"
          REFS_BUDGET_MS: "2700000"
          REFS_PACE_MS: "400"
        run: node lit/_scraper-refs/build-refs.mjs
      - name: Publish refs data to its repository
        if: always() && github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish refs
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-refs-${{ github.run_id }}
          path: _lit-data/refs/data/
          retention-days: 14
          if-no-files-found: ignore
