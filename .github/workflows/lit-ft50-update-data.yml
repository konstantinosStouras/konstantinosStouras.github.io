name: lit — update FT50 (merged catalog) data
on:
  schedule:
    - cron: 15 7 * * *
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/lit-ft50-update-data.yml
      - lit/_scraper-ft50/build-data.mjs
      - lit/_scraper-ft50/informs-editors.mjs
      - lit/_scraper-ft50/journals.json
concurrency:
  group: lit-cloud-ft50-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: ft50
          ssh-key: ${{ secrets.LIT_DATA_FT50_DEPLOY_KEY }}
          datasets: core ft50
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Build data (Crossref, one pull per FT50 journal)
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          FT50_MAILTO: kstouras+litft50@gmail.com
          NODE_OPTIONS: --max-old-space-size=6144
        run: node lit/_scraper-ft50/build-data.mjs
      - name: Publish ft50 data to its repository
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish ft50
      - name: Verify published data
        if: github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs verify ft50
      - name: Summary
        if: always()
        run: |
          echo "### lit FT50 (merged catalog) data build" >> "$GITHUB_STEP_SUMMARY"
          if [ -f lit/data-ft50/meta.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat lit/data-ft50/meta.json >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-ft50-${{ github.run_id }}
          path: _lit-data/ft50/data/
          retention-days: 14
          if-no-files-found: ignore
