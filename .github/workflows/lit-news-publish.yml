name: lit — publish a What's-new entry
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Changelog entry id(s) to act on, space-separated (see lit/changelog.json). Ignored with list_only.
        type: string
        default: ""
      status:
        description: The decision to write
        type: choice
        options:
          - approved
          - removed
        default: approved
      dry_run:
        description: Dry run — print what would be written, write nothing
        type: boolean
        default: false
      list_only:
        description: Just report every entry's decision state (no ids needed)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lit-news-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Offline checks
        run: |
          node lit/_scraper/news-selftest.mjs
          node lit/_scraper/news-publish.mjs --selftest
      - name: Install Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0
      - name: Publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node lit/_scraper/news-publish.mjs ${{ inputs.list_only && '--list' || format('--status {0} {1} {2}', inputs.status, (inputs.dry_run && '--dry-run' || ''), inputs.ids) }}
