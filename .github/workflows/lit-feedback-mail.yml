name: lit — feedback forwarder

# Forwards the messages left on stouras.com/lit/feedback/ to the maintainer.
# The static page stores each submission (message + compressed screenshots) in
# the Firestore `feedback` collection; this job reads the pending ones with the
# Admin SDK, e-mails each with its screenshots attached, and marks it forwarded.
# The same run then applies any repo-recorded RESOLUTIONS from
# lit/_feedback-resolutions/ (one file per resolved ticket): it closes the
# feedback doc and e-mails the submitter "your feedback is resolved" with the
# fix description + link — idempotent via a content hash, so files stay in
# place as the public record. A third pass announces the OTHER queue on that
# page: a suggested PUBLISHED paper the catalog lacks (paperSubmissions,
# status 'review') is never added automatically, so each one is e-mailed to
# the maintainer once — `reviewMailedAt` stamped after the send, a burst as
# one list — instead of waiting silently in the 📄 Paper suggestions inbox.
# See lit/_scraper/feedback-mailer.mjs,
# lit/_feedback-resolutions/README.md and lit/_FEEDBACK-SETUP.md.
#
# It stays a clean no-op until the secrets below are configured, so it does not
# fail before you set things up. Required repo secrets:
#   FIREBASE_SERVICE_ACCOUNT  – JSON of a Firebase service-account key
#   SMTP_USER, SMTP_PASS      – SMTP login (e.g. a Gmail address + App Password)
# Optional: SMTP_HOST (default smtp.gmail.com), SMTP_PORT (default 465),
#   ALERTS_FROM (default SMTP_USER), ALERTS_FROM_NAME (default "The Lit"),
#   FEEDBACK_TO (default kstouras@gmail.com — where feedback is delivered).

on:
  schedule:
    # GitHub throttles the `schedule` event under load — worst of all at the top
    # of the hour and the :00/:15/:30/:45 boundaries everyone schedules on, where
    # runs are routinely delayed 30–60 min or skipped. Run every 10 minutes on
    # OFF-boundary minutes so a submission lands promptly instead of waiting for
    # the next lightly-loaded slot. (Need it instantly? Actions → this workflow →
    # "Run workflow" forwards everything pending on demand.)
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — read pending feedback and print, but send nothing'
        type: boolean
        default: false
      scan:
        description: 'List pending feedback and exit (sends nothing)'
        type: boolean
        default: false

permissions:
  contents: read              # reads nothing it commits; forwards over SMTP only

concurrency:
  group: lit-feedback-mail
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install mailer dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0 nodemailer@6.10.1

      - name: Forward feedback
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
          FEEDBACK_TO: ${{ secrets.FEEDBACK_TO }}
        run: node lit/_scraper/feedback-mailer.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.scan) && '--scan' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
