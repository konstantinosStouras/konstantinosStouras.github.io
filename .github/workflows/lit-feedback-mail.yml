name: lit — feedback forwarder
on:
  schedule:
    - cron: 3,13,23,33,43,53 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run — read pending feedback and print, but send nothing
        type: boolean
        default: false
      scan:
        description: List pending feedback and exit (sends nothing)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lit-feedback-mail
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install mailer dependencies
        run: npm install --no-save --ignore-scripts firebase-admin@12.7.0 nodemailer@6.10.1
      - name: Forward feedback
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
          ALERTS_FROM_NAME: ${{ secrets.ALERTS_FROM_NAME }}
          FEEDBACK_TO: ${{ secrets.FEEDBACK_TO }}
        run: node lit/_scraper/feedback-mailer.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.scan) && '--scan' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
