name: lit — refresh editors (Crossref + publisher) and INFORMS abstracts
on:
  schedule:
    - cron: 35 */3 * * *
  workflow_dispatch: {}
concurrency:
  group: lit-cloud-core-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /*
            !/*/
            /.github/
            /tools/
            /lit/
            !/lit/data/
            !/lit/data-ft50/
            !/lit/data-refs/
            !/lit/data-workingpapers/
            !/lit/analytics/*.json
      - name: Load cloud datasets
        uses: ./.github/actions/lit-data
        with:
          write: core
          ssh-key: ${{ secrets.LIT_DATA_CORE_DEPLOY_KEY }}
          datasets: core ft50
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Check editorial refresh regressions
        run: node lit/_scraper/editorial-refresh-selftest.mjs
      - name: Refresh recent editors via Crossref, then try publisher HTML
        env:
          LIT_EDITORS_BUDGET_MS: "1500000"
          LIT_EDITORS_MAX_FAILS: "12"
        run: node lit/_scraper/informs-editors-local.mjs
      - name: Crawl INFORMS full abstracts (teaser rows only, bounded, resume-safe)
        env:
          LIT_ABSTRACTS_BUDGET_MS: "1200000"
          LIT_ABSTRACTS_MAX_FAILS: "12"
        run: node lit/_scraper/informs-abstracts-local.mjs
      - name: Publish core data to its repository
        if: always() && github.ref == 'refs/heads/master'
        run: node lit/_scraper/cloud-data.mjs publish core
      - name: Preserve unpublished data after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unpublished-core-${{ github.run_id }}
          path: _lit-data/core/data/
          retention-days: 14
          if-no-files-found: ignore
